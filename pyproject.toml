[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "datagenome"
version = "0.4.0"
description = "Local dataset profiling and diagnostics"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.26,<3", "scipy>=1.10,<2", "scikit-learn>=1.6,<2", "threadpoolctl>=3.5,<4"]

[project.optional-dependencies]
api = ["argon2-cffi>=23.1,<26", "fastapi>=0.121,<1", "uvicorn>=0.35,<1"]
dev = ["build>=1,<2", "httpx>=0.28,<1", "mypy>=1,<3", "pytest>=8,<10", "ruff>=0.12,<1"]

[project.scripts]
datagenome = "datagenome.cli:main"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
strict = true
files = ["src/datagenome"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "threadpoolctl", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
